plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    id 'net.minecraftforge.gradle' version '7.0.20' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

def publishLoaderProjects = ['fabric', 'neoforge']
        .collect { findProject(":${it}") }
        .findAll { it != null }

tasks.register('publishMods') {
    group = 'publishing'
    description = 'Uploads Fabric and NeoForge jars to Modrinth and CurseForge.'
    dependsOn publishLoaderProjects.collect { "${it.path}:modrinth" } +
              publishLoaderProjects.collect { "${it.path}:publishCurseForge" }
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = 'Uploads Fabric and NeoForge jars to Modrinth.'
    dependsOn publishLoaderProjects.collect { "${it.path}:modrinth" }
}

tasks.register('publishCurseForge') {
    group = 'publishing'
    description = 'Uploads Fabric and NeoForge jars to CurseForge.'
    dependsOn publishLoaderProjects.collect { "${it.path}:publishCurseForge" }
}

tasks.register('publishInfo') {
    group = 'publishing'
    description = 'Prints publishing details for Fabric and NeoForge jars without uploading.'
    dependsOn publishLoaderProjects.collect { "${it.path}:publishInfo" }
}

